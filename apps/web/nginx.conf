server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Photos and videos are uploaded through /api — allow large bodies.
  client_max_body_size 1g;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/calendar;
  gzip_min_length 1024;

  # The service worker and app shell must never be cached by the browser, or
  # the installed app would keep running an old version.
  location = /sw.js            { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /push-sw.js       { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /registerSW.js    { add_header Cache-Control "no-cache"; try_files $uri =404; }
  location = /index.html       { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { application/manifest+json webmanifest; } }

  # Hashed build assets never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA — always serve index.html for unknown paths.
  location / {
    try_files $uri /index.html;
  }

  # API proxy — assumes api service reachable at http://api:3000 inside compose network.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Uploads and the offline bundle can take a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
  }

  # MinIO media proxy — serves bucket assets through the app's own origin so
  # media works over HTTPS without exposing port 9000.
  location /tagg-media/ {
    proxy_pass http://minio:9000/tagg-media/;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}

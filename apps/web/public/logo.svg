<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 96" fill="none">
  <!--
    TINNITUS A GO GO — newspaper cut-and-paste / ransom note logotype
    Left: bleeding ear on a newsprint scrap.
    Right: individual letter tiles, each slightly rotated.
    Lime (#A8FF3E) and pink (#FF3D6E) used as accent tile fills.
  -->

  <!-- ═══════════ EAR TILE (left mark) ═══════════ -->
  <g transform="translate(2,6) rotate(-3,22,42)">
    <!-- Newsprint paper scrap -->
    <rect width="44" height="84" rx="2" fill="#E8E3D0"/>
    <!-- Torn top-edge hint -->
    <path d="M0 6 L3 3 L7 5.5 L10 2.5 L14 5 L18 2 L22 4.5 L26 2 L30 5 L34 2.5 L38 5 L42 3 L44 5 L44 7 Z" fill="#1C1A18" opacity="0.1"/>

    <!-- Ear outer body (dark) -->
    <path d="
      M24 10
      C29 9 36 14 37 23
      C38 33 36 49 32 57
      C29 62 25 65 22 65
      L20 65
      C18 65 17 63 17 61
      C17 59 18 57 19 56
      C21 53 21 50 21 45
      C21 40 20 32 21 25
      C22 18 21 11 24 10 Z
    " fill="#1C1A18"/>

    <!-- Ear inner cutout (cream) -->
    <path d="
      M24 15
      C28 14 34 18 35 26
      C36 35 34 49 30 55
      C28 59 24 61 22 61
      C21 61 20 60 20 58
      C20 56 21 54 22 52
      C24 49 24 45 24 40
      C24 34 23 23 24 15 Z
    " fill="#E8E3D0"/>

    <!-- Canal -->
    <ellipse cx="20" cy="38" rx="2.5" ry="4" fill="#1C1A18"/>

    <!-- Lobe -->
    <ellipse cx="20" cy="65" rx="4.5" ry="3.5" fill="#1C1A18"/>

    <!-- Blood pool at lobe base -->
    <ellipse cx="18" cy="68" rx="3" ry="2" fill="#CC0F0F"/>
    <!-- Blood drip -->
    <path d="M16.5 69 Q15 72.5 16 76 Q16.5 78 18.5 77.5 Q20 76.5 19.5 73 Q18 69 16.5 69 Z" fill="#CC0F0F"/>
  </g>

  <!-- ═══════════ Row 1 · T I N N I T U S (shifted +58 from original) ═══════════ -->

  <!-- T · black paper, cream ink, -2° -->
  <g transform="translate(58,4) rotate(-2,14,21)">
    <rect width="28" height="40" rx="2" fill="#1C1A18"/>
    <text x="14" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#E8E3D0">T</text>
  </g>

  <!-- I · cream paper, black ink, +1.5° -->
  <g transform="translate(88,3) rotate(1.5,10,21)">
    <rect width="20" height="40" rx="2" fill="#E8E3D0"/>
    <text x="10" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#1C1A18">I</text>
  </g>

  <!-- N · lime paper, black ink, -1° -->
  <g transform="translate(110,5) rotate(-1,16,21)">
    <rect width="32" height="40" rx="2" fill="#A8FF3E"/>
    <text x="16" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#1C1A18">N</text>
  </g>

  <!-- N · off-white paper, dark ink, +2° -->
  <g transform="translate(144,2) rotate(2,16,21)">
    <rect width="32" height="40" rx="2" fill="#D8D4C0"/>
    <text x="16" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#1C1A18">N</text>
  </g>

  <!-- I · black paper, cream ink, -1.5° -->
  <g transform="translate(178,4) rotate(-1.5,10,21)">
    <rect width="20" height="40" rx="2" fill="#1C1A18"/>
    <text x="10" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#E8E3D0">I</text>
  </g>

  <!-- T · cream paper, black ink, +1° -->
  <g transform="translate(200,3) rotate(1,14,21)">
    <rect width="28" height="40" rx="2" fill="#E8E3D0"/>
    <text x="14" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#1C1A18">T</text>
  </g>

  <!-- U · pink paper, cream ink, -2° -->
  <g transform="translate(230,5) rotate(-2,16,21)">
    <rect width="32" height="40" rx="2" fill="#FF3D6E"/>
    <text x="16" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#F0ECE0">U</text>
  </g>

  <!-- S · off-white paper, black ink, +1.5° -->
  <g transform="translate(264,3) rotate(1.5,14,21)">
    <rect width="28" height="40" rx="2" fill="#D8D4C0"/>
    <text x="14" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="34" fill="#1C1A18">S</text>
  </g>

  <!-- ═══════════ Row 2 · a  G o  G o (shifted +56) ═══════════ -->

  <!-- a · cream paper, serif italic, -3° -->
  <g transform="translate(62,51) rotate(-3,13,19)">
    <rect width="26" height="34" rx="2" fill="#E8E3D0"/>
    <text x="13" y="27" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif"
      font-weight="700" font-style="italic" font-size="28" fill="#1C1A18">a</text>
  </g>

  <!-- G · black paper, lime ink, +1° -->
  <g transform="translate(92,49) rotate(1,18,20)">
    <rect width="36" height="36" rx="2" fill="#1C1A18"/>
    <text x="18" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="32" fill="#A8FF3E">G</text>
  </g>

  <!-- o · off-white paper, dark serif, -1° -->
  <g transform="translate(131,52) rotate(-1,14,18)">
    <rect width="28" height="32" rx="2" fill="#D8D4C0"/>
    <text x="14" y="26" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif"
      font-weight="700" font-size="26" fill="#1C1A18">o</text>
  </g>

  <!-- G · lime paper, black ink, +2° -->
  <g transform="translate(164,48) rotate(2,18,20)">
    <rect width="36" height="36" rx="2" fill="#A8FF3E"/>
    <text x="18" y="30" text-anchor="middle"
      font-family="Impact,'Arial Narrow',Arial,sans-serif"
      font-weight="900" font-size="32" fill="#1C1A18">G</text>
  </g>

  <!-- o · black paper, cream serif, -2° -->
  <g transform="translate(204,52) rotate(-2,14,18)">
    <rect width="28" height="32" rx="2" fill="#1C1A18"/>
    <text x="14" y="26" text-anchor="middle"
      font-family="Georgia,'Times New Roman',serif"
      font-weight="700" font-size="26" fill="#E8E3D0">o</text>
  </g>
</svg>

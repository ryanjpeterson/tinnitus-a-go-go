# Tailscale overlay — run alongside the base compose file to expose the app
# on your Tailnet so macmini and macbookair can reach it.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d
#
# Or add to your shell alias / Makefile:
#   alias tagg-up="docker compose -f docker-compose.yml -f docker-compose.tailscale.yml up -d"
#
# Steps:
#   1. Install Tailscale on this Mac if not already (https://tailscale.com/download)
#   2. Run `tailscale ip -4` to get your Tailscale IP (e.g. 100.64.0.1)
#   3. Copy .env.example to .env and set the variables below
#   4. Run with the overlay as shown above
#
# Required .env additions (in addition to the base .env):
#   TAILSCALE_HOST=100.x.x.x        ← your Tailscale IP from `tailscale ip -4`
#   CORS_ORIGINS=http://localhost:4444,http://100.x.x.x:4444
#   MINIO_PUBLIC_URL=http://100.x.x.x:9000
#   APP_URL=http://100.x.x.x:4444

name: tinnitus-a-go-go

services:
  api:
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      APP_URL: ${APP_URL}
    # Bind API on all interfaces so Docker can forward from Tailscale IP
    ports:
      - "0.0.0.0:3000:3000"

  web:
    environment:
      # The Vite dev server is already bound to 0.0.0.0 in vite.config.ts
      VITE_API_URL: http://api:3000
      VITE_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "0.0.0.0:4444:4444"

  minio:
    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA — always serve index.html for unknown paths.
  location / {
    try_files $uri /index.html;
  }

  # API proxy — assumes api service reachable at http://api:3000 inside compose network.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # MinIO media proxy — serves bucket assets through the app's own origin so
  # media works through Tailscale Funnel without exposing port 9000 publicly.
  # MINIO_PUBLIC_URL should equal the app base URL (no port suffix).
  location /tagg-media/ {
    proxy_pass http://minio:9000/tagg-media/;
    proxy_set_header Host minio:9000;
    proxy_set_header X-Real-IP $remote_addr;
    # Large media files — raise timeouts and buffer sizes.
    proxy_read_timeout 120s;
    proxy_buffering off;
  }
}
